    54 candidates.
  inputs: []
P15_posterior:
  status: CURRENT
  note: >-
    Carries the PI's resolution of item 1.23 -- the discontinuity conjunct of the sampleability
    criterion is lifted, on an argument that predates the data: nested sampling requires only that L
    have no ATOMS under the prior, a plateau creates one and a jump does not. That reasoning is
    recorded in D0 and was committed alone before any sampler was launched. The run then failed for
    an unrelated and more interesting reason. Run 1 CRASHED after ~9.9 h at iteration 11,547 (dlogz
    2.168, logZ -25.730) with dynesty's slice sampler unable to find a valid point, its bracket
    steps collapsed to denormal doubles; no samples, weights or summary were written, run 2 was not
    started, and NO POSTERIOR IS QUOTED. The cause was diagnosed from the checkpoint's own 800 live
    points and is the report's main result: the degenerate direction is dTm +0.903 / tm_scale
    -0.217 with corr +0.831, which is exactly the pair Y3 showed is not jointly identified -- two
    unrelated methods, likelihood profiling and live-point geometry, agreeing. One of the run's own
    conclusions was wrong and is corrected inside it rather than edited away: D2 called the crash
    stochastic, and D3 retracts that after a resume reproduced it bit-identically.
  evidence: >-
    task0_verify.py re-confirms state-independence in ~4 min; task1_proofs.py re-runs the three
    dynesty proofs (the prior transform deferred to P11's own script, which regenerates its
    committed output byte-identically); run_nested.py is P11's runner changed only in its output
    directory, first_update, log location and an assertion that the strain config is on clamp;
    task1_crash_diag.py restores the committed checkpoint and recomputes the live-point covariance
    in seconds. The seven-strain gate (79/79, 60/60) comes from the standard battery. The crash is
    reproducible by resuming dynesty_run1.save with the same settings.
