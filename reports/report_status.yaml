P13_support:
  status: CURRENT
  note: >-
    Replaces the respiration term's support discount with a bounded form, and STOPS before the two
    nested runs. Every number is a measurement from committed output. The run's two load-bearing
    results are negative and are reported as such: the recommended support form (impute O2 = 0 where
    growth stops) was WITHDRAWN because a non-growing cell still respires for maintenance -- at every
    dead temperature of a live endpoint the LP is feasible with O2 = 0.525-5.674 -- so imputation
    fails P10's own D3a state gate by 119.14 log-likelihood units; and TASK 3 found the surface NOT
    SAMPLEABLE at p38, with axis:topt_scale carrying 8.55 units between two FEASIBLE points against
    the absolute rule's 5, IDENTICALLY under the old and new support handling (8.5519 vs 8.5517), so
    the blocker predates this run and is untouched by it. TASK 4 and TASK 5 were therefore not
    attempted and nothing is quoted from them. What IS established: clamp is adopted on measurement
    (the mask was discarding real predictions -- 4 of 4 dead temperatures at live endpoints carry a
    finite O2), it is state-independent at the boundary where the current likelihood is not (0.0000
    against 0.0157 over ten fresh-model evaluations), and the growth mask is an attractor for the
    optimiser (4 of 12 endpoints sit on it exactly). The report qualifies P11's SAMPLEABLE verdict as
    centre-dependent and P12's ceiling test as mask-assisted, both by dated note with no numbers
    edited. Two predictions were pre-registered before TASK 4 and could not be evaluated because
    TASK 4 did not run; they stand as written.
  evidence: >-
    task0_baseline.py reproduces the three baseline log-likelihoods in ~2 min; task1_schemes.py the
    three-scheme table and the epsilon sensitivity in ~5 min; task1b_state_and_continuity.py the D3a
    state test and the continuity scans in ~25 min; addendum1_why_clamp.py the feasible/infeasible
    classification, the knife-edge counts and the ten fresh-model evaluations in ~20 min;
    task3_lines.py re-scans the twelve lines at p38 under both schemes in ~16 min on 8 processes and
    task3_verdict.py and task3_decompose_step.py are arithmetic and a single LP pair over its output.
    The seven-strain gate (79/79, 60/60) and the P3 gate table are regenerated by the standard
    battery; the P3 table is byte-identical with the option ON.


P14_posterior:
  status: CURRENT
  note: >-
    Replaces the sampleability criterion and STOPS before the two nested runs. The criterion was
    written into DECISIONS.md before any of its data existed, and its headline result reverses the
    previous verdict on the decisive line: axis:topt_scale, which stopped P13 at 8.55 log-likelihood
    units, refines as 8.5517 -> 4.3325 -> 2.2295 -> 1.1236 with ratios 0.507/0.515/0.504 and is
    therefore pure STEEPNESS. The plateau test -- the property that actually voids nested sampling's
    volume shrinkage -- passes with 0 of 480 adjacent evaluations exactly equal on any of the twelve
    lines. Four lines nevertheless retain genuine discontinuities of 0.05-0.59 units, all one
    mechanism (97-100 % respiration term, growth unchanged to five decimals, O2 moving 0.57-1.86x at
    a single cold temperature) which is P9's LP vertex switch two orders of magnitude smaller than
    when it was diagnosed. The prompt stops TASK 2 on any JUMP, so the runs were not started and
    nothing is quoted from them; the case for lifting that conjunct is recorded in D3 and put to the
    PI rather than acted on, because moving a threshold after seeing its data would be the fourth
    time in this series. A first pass of the refinement test was WRONG and is corrected in D2 rather
    than edited away: it tested each line's largest step overall, which on eight of twelve lines is
    the feasibility transition the criterion exempts by name.
  evidence: >-
    task0_verify.py re-confirms state-independence after the merge in ~4 min (ten fresh builds);
    task1_refine.py and task1_refine2.py regenerate the refinement series in ~7 and ~20 min
    (fresh model per evaluation, single process); task1_plateau.py is arithmetic over P13's
    committed clamp scan; task1_jump_diag.py bisects and decomposes the four residual jumps in
    ~7 min. The seven-strain gate (79/79, 60/60) comes from the standard battery.

ecoli_deck:
  status: CURRENT
  note: >-
    a slide deck, not an analysis: it assembles committed figures and draws three from committed
    tables. No fit, no solve, no prior change. Seven candidate figures are excluded because the
    unsupported interval from the older E. coli posterior is drawn inside the image; no interval
    from that family appears on any slide, and gas-flux slides are labelled mechanism. Nothing
    from P15 appears.
  evidence: >-
    `python3 reports/ecoli_deck/make_figures.py` rebuilds the three local figures from
    `strains/eciML1515/respirometry/derived_*_current.csv` and
    `reports/Y2_regime_posterior/task3_posterior_draws.csv`; `cd reports/ecoli_deck && quarto
    render deck.qmd` produces the committed `_output/deck.pdf` (20 slides, no overfull box, no
    unresolved citation). Every other figure is pointed at by relative path in its producing
