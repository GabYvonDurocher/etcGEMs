T3_determinism:
  status: CURRENT
  note: >-
    Measures four candidate remedies for the R1 blocker T2 named (item 1.34) on one fixed, hashed
    22-input set against a bit-reproducible fresh-process reference, and stops with a
    recommendation the PI must register. Only a FRESH MODEL PER EVALUATION is deterministic (0.0
    deviation at every input and every evaluation), at a measured 3.2x the current cost. A solver
    reset per call is WORSE than doing nothing (max deviation 23.28 against 1.82, 63 % more cost):
    it discards the basis but not the degeneracy. Gurobi's lexicographic tie-break returns a
    DIFFERENT VERTEX (O2 differs by up to 4.58 on D NLDM and 8.40 on E LB) and is disqualified
    before any determinism verdict. Two magnitudes, plausibly one cause: D NLDM shows a 1e-8 haze
    with rare order-1 excursions, E LB -- an LP face -- shows 1.5-1.8 routinely. The corruption
    attaches to the evaluation, not to theta. The 20 highest-weight posterior samples of T2's runs
    1 and 2 are clean to 2e-8, so the defect does NOT explain their disagreement and a second cause
    remains. Nothing implemented, enabled or run; no reserved seed consumed.
  evidence: >-
    t3_inputs.py builds and hashes the input set (inputs.json, sha256 8aef2dfd); t3_battery.py runs
    one battery per invocation (--scheme ref|A|B|C|D|Cverify, ~5-55 min each under its registered
    alarm); lexi_tiebreak.py is the SCRATCH lexicographic module, measurement only and not in the
    core; t3_table.py applies D0's decision rule to battery_*.json; t3_task2.py re-evaluates the
    high-weight posterior samples of T2's runs 1 and 2 in a fresh process each.

