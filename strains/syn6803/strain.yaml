# Strain: Synechocystis sp. PCC 6803 (oxygenic phototroph / cyanobacterium). ORGANISM ONLY.
#
# The LOW-Ea third point of the Yvon-Durocher 2014 ordering (CH4 > respiration >
# photosynthesis). Chosen regime (locked by the user): LIGHT-SATURATED, so the rate is
# set by carbon fixation (RuBisCO / Calvin-cycle kcat(T)) and the organism stays fully
# IN-MECHANISM -- the SAME control-weighted, enzyme-cost decomposition used for E. coli
# and M. maripaludis, with NO new light-supply layer. Under saturating light the photon
# exchange is non-binding (slack) and the enzyme pool binds (verified P1).
#
# P1 (this phase): scaffold + QC'd base GEM under a light-saturated autotrophic medium,
# PLAIN FBA only. The thermal layer (kcat(T)/unfolding), the enzyme layer read-through
# and calibration are P2+. The `provider.type` below is a placeholder for P1 (the base
# GEM is loaded directly with cobra); P2 switches it to the enzyme-constrained provider
# reusing the PRE-BUILT ecModel iSynCJ816_STAR (see below) -- NOT a from-scratch sMOMENT
# build. See docs/PHOTOTROPH_ETCGEM_PLAN.md and outputs/P1_scaffold_and_base.md.
#
# Organism: Synechocystis sp. PCC 6803 (glucose-tolerant model cyanobacterium).
# Oxygenic photoautotroph: light -> PSII/PSI -> ATP/NADPH; CO2/HCO3- fixed by RuBisCO
# (RBPC_1) in the Calvin-Benson-Bassham cycle; photorespiration via RuBisCO oxygenase
# (RBCh_2). Mesophile, growth optimum ~35 C (Zavrel et al. 2015).

organism:
  name: Synechocystis sp. PCC 6803
  metabolism: oxygenic photoautotroph (light-saturated; CO2/HCO3- fixed by RuBisCO, Calvin cycle)
  regime: light-saturated (carbon-fixation-limited; in-mechanism, no new light layer)
  Topt_C: 35                  # growth optimum under saturating light (Zavrel et al. 2015)
  Trange_C: [15, 44]          # rising limb to inhibition ~44 C (Zavrel 2015)

provider:
  # P1: PLAIN FBA on the base GEM (type is a placeholder; P1 loads the model directly).
  # P2: switch to the enzyme-constrained provider (smoment_gem-style) reading the PRE-BUILT
  # ecModel iSynCJ816_STAR -- the enzyme pool + kcats already exist, so P2 adds only the
  # thermal layer + calibration, NOT a from-scratch enzyme build.
  type: fba
  model_file: model/iSynCJ816.xml      # base GEM (Joshi et al. 2020; BiGG), plain FBA in P1
  biomass_rxn: BIOMASS_Ec_SynAuto_1    # AUTOTROPHIC biomass (Syn{Auto,Mixo,Hetero} available)

  # --- P2 route (CONFIRMED, pre-built): enzyme-constrained ecModel ---
  # iSynCJ816_STAR (Andrews; AUTOPACMEN sMOMENT pipeline, Bekiaris & Klamt 2020) built on
  # iSynCJ816. Repo: https://github.com/FraserAndrews7/iSynCJ816- (commit 78449d2, 2024-05-20).
  # Local copy: model/ecmodel_iSynCJ816_STAR/{iSynCJ816_STAR.xml,.json, mass mapping, kcats}.
  # Structure: prot_pool pseudo-metabolite; enzyme budget = reaction ER_pool_TG_ (UB 0.26
  # g/gDW); 409 sMOMENT-split (_TG_) arm reactions; kcats from BRENDA + SABIO-RK. Under
  # pure autotrophy + saturating light the pool BINDS and photon is slack (in-mechanism).
  ecmodel_file: model/ecmodel_iSynCJ816_STAR/iSynCJ816_STAR.xml
  ecmodel_pool_reaction: ER_pool_TG_    # sMOMENT enzyme-budget supply (P_metab); UB 0.26 g/gDW
  ecmodel_pool_metabolite: prot_pool

  # --- P2 thermal envelope (WIRED; entry point run_p2_thermal.py) ---
  # providers.from_gecko route-B on iSynCJ816_STAR (base_cost = prot_pool coeff = MW/kcat),
  # thermal_model=unfolding: cost(T) = base_cost / (rel_kcat(T)*f_N(T)). The etcgem enzyme_pool
  # (budget_override 0.26, the STAR sMOMENT budget = emergent P_metab) is the sole enzyme-mass
  # constraint; STAR's own ER_pool_TG_ is relaxed. Nothing fit to Zavrel. See outputs/P2_thermal.md.
  thermal_model: unfolding
  enzyme_params: thermal/enzyme_thermal_params.csv   # 1066 rxns; mesophile Topt+Tm prior (rxn_id key)
  enzyme_params_key: rxn_id
  budget_override: 0.26        # STAR grounded sMOMENT enzyme budget (emergent, not fit)
  dcp_prior_kJ: -4.0          # literature MMRT dCp prior (Hobbs 2013); Ea EMERGES
  ngam_temperature: true      # temperature-dependent maintenance NGAM(T)
  ngam_reaction: ATPM
  ngam_base_scale: 0.548      # anchors NGAM(35C)=3.12 mmol ATP/gDW/h (Touloupakis 2015 measured maintenance)
  close_free_o2_sinks: false  # cyano: no E. coli O2-sink curation

T0_C: 35                      # reference temperature (Zavrel 2015 optimum)

temperature_grid:
  start_C: 5
  stop_C: 50
  n: 46

# --- calibration / validation TPC (P2+; NOT used in P1) ---
# Zavrel et al. 2015 (Eng. Life Sci. 15:122): growth rate vs temperature for glucose-
# tolerant Synechocystis 6803 in a flat-panel photobioreactor under DOCUMENTED SATURATING
# red light (220-360 umol m^-2 s^-1; no photoinhibition to 660). Topt ~35 C, Q10 ~1.70 on
# the rising limb, inhibition by ~44 C. Digitise the temperature response for P2 validation
# (the light-saturated growth-rate TPC is the PRIMARY, symmetric target across all three
# organisms; a carbon-fixation-flux TPC is a SECONDARY descriptor for the cleanest
# comparison to Yvon-Durocher 2014's photosynthesis-flux Ea).

# --- P2 thermal layer inputs (TO DO in P2; not present yet) ---
# Topt: Li-Engqvist sequence predictor on the 6803 proteome (portable). Tm: mesophile
# prior (6803 absent from the Meltome Atlas), same route as the methanogen. Curvature:
# literature MMRT dCp prior -4 kJ/mol/K (Hobbs 2013). kcats: already in the ecModel
# (RuBisCO/Calvin turnovers are well-measured, unlike the archaeal core -- a de-risking
# vs the methanogen).

# --- P3b proteome-sector / allocation layer (WIRED; the CYANO'S OWN strategy) ---
# Grounded in Jahn et al. 2018 (Cell Rep 25:478) Fig 2A: seven proteome sectors vs mu over
# 0.016-0.106/h, total protein invariant. Mapped onto our three sectors (light-harvesting ->
# metabolic): f_metab = LHC+PSET+CBM+GLM+LPB ~0.50; f_maint = MAI ~0.33 ("did not exceed 33%");
# f_bio = RIB 0.17 (ribosome/translation, INCREASING with mu = the coupling slope). Corroborated
# by Zavrel et al. 2019 (eLife e42508: translation up / light-harvesting down with mu; total
# protein ~402 mg/gDW; Faizi 2018 coarse-grained T/M/R/P/LHC framework). Suzuki et al. 2006
# (J Exp Bot 57:1573) heat-shock chaperones (GroESL/HtpG/HspA) inform the maintenance-sector
# rise near the upper thermal limit. Wired via calibration_multi.SYN6803_SECTOR_CFG /
# _build_pm_syn6803_sectored (reuses sectors.py; entry point run_p3b_sectors.py).
# Result (P3b_sectors/): NEAR-NEUTRAL (Topt 35, CTmax preserved, rmax -4%, max|dmu| 0.004, no
# re-fit); allocation buffer -0.019 eV (E. coli -0.13 | methanogen 0.00 | phototroph -0.019) ->
# the low phototroph Ea is KINETIC (shallow Calvin kcat(T)), not allocation-set, on a symmetric footing.
proteome_sectors:
  enabled: true               # single-pool P3 model remains available (enabled: false)
  P_total: null               # back out from the P3 metabolic budget (0.26/0.50 = 0.52 g/gDW);
                              # Zavrel 2019 measured ~0.402 g/gDW total protein (corroboration)
  f_metab: 0.50               # LHC+PSET+CBM+GLM+LPB (Jahn 2018; light-harvesting -> metabolic)
  f_maint: 0.33               # MAI (Jahn 2018)
  sigma_nom: 0.45
  atpm_reaction: ATPM
  biosynthesis_growth_law: true
  growth_law_slope: 0.39      # RIB rising limb (Jahn 2018 Fig 2A, per 1/h); SMALL in absolute
                              # terms over mu<=0.11/h -> small buffer (vs E. coli Scott 0.33 over mu~2)
  growth_law_f_bio0: 0.133    # RIB intercept = f_bio_nom(0.17) - slope*mu_op(~0.094)
  translation_coeff: 0.9      # ribosome cap PINNED non-binding (M6-style; Jahn RIB nearly constant)
                              # -> metabolic pool stays binding (kcat(T)-limited); buffer from the
                              # metabolic-sector shrinkage term only, preserving Topt/the P3 fit
  nominal_kcat_scale: 1.22    # P3 posterior-median kcat_scale (sector co-limit at operating point)

# Photoautotrophic light-saturated medium (availability, not pinned uptake):
medium:
  name: BG11_photoautotrophic_light_saturated   # see media/BG11_photoautotrophic_light_saturated.md
  energy: SATURATING light (EX_photon_e non-limiting -> slack in enzyme model)
  inorganic_carbon: CO2 (EX_co2_e) + bicarbonate (EX_hco3_e, CCM)
  nitrogen: nitrate (EX_no3_e)
  organic_carbon: CLOSED (EX_glc__D_e = 0; forces true autotrophy)
  products: O2 (net efflux, photosynthetic)
