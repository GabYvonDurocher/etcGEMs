# Gas-exchange data for E. coli iML1515 (P1).
#
# STRAIN DATA ONLY -- measured properties of E. coli and of the eciML1515 encoding. Nothing
# here switches anything on: the mechanisms live in src/etcgem/{gasflux,etc_area}.py and are
# selected per run by a `gasflux:` block in a configs/experiments/ overlay. This file is read
# ONLY when such an overlay enables the layer, which is why it is a separate file rather than
# a block in strain.yaml: adding it to strain.yaml would change the `resolved_config.yaml` of
# every existing eciML1515 run, and those are committed, verified artefacts (P1 DECISIONS D3).
gas_exchange:
  gdw_per_cell: 2.8e-13       # g dry weight per cell; converts mmol/gDW/h -> fmol/cell/h

  lb_media_csv: media/LB_media.csv
  bhi_media_csv: media/BHI_media.csv

  media:                      # defined media given as a recipe of concentrations
    NLDM:
      recipe_csv: media/NLDM_media.csv
      clearance_L_per_gDW_h: 5.0   # the one physical scale factor: ub_i = clearance * C_i.
                                   # 2-10 L/gDW/h is the physiological range for bacterial
                                   # uptake; 5.0 puts the total carbon ceiling at ~431 mmol
                                   # C/gDW/h, ~3.4x the observed peak uptake, so the medium
                                   # does not artificially bind in exponential phase.
      uptake_ub: 1000.0            # non-carbon components (salts, minerals) and O2

    NLDM_blanket:               # the SAME component list with NO per-component ceilings --
      recipe_csv: media/NLDM_media.csv   # every component open at uptake_ub. This is what
      clearance_L_per_gDW_h: null        # Parsa's committed gas-flux CSVs were produced with,
      uptake_ub: 1000.0                  # before he added the recipe-proportional ceilings.
                                         # Kept so his numbers can be reproduced exactly; the
                                         # recipe medium above is the better model and the
                                         # default. See reports/P1_parsa_port/gate.md.

  transport_carrier:          # generic inner-membrane carrier, for MMRT-costed transport
    # kcat SETTLED BY EXPERIMENT, P2 TASK 1 -- PROVISIONAL, pending Parsa's confirmation.
    # His sources disagreed: gasflux.py set TRANSPORT_KCAT = 30 s^-1, while his configuration-A
    # figure, its CSV filename (mmrt_transport_kcat300.csv) and his report all said 300. Both
    # were run against his committed output (reports/P2_settle/task1_kcat.py):
    #   300 s^-1 -> T_opt exact in all four media, every optimum quantity within 7.4e-4
    #               relative, whole curve within 6.0e-4 of r_max  -> REPRODUCES his figure
    #    30 s^-1 -> T_opt off by 0.5 C in three media, r_max 5.5-5.8% low, curve 14% of r_max
    #               away                                          -> does NOT reproduce it
    # So 30 was a stale module default his runs overrode. 300 is set here.
    kcat_s: 300.0
    mw_kDa: 45.0
    length_aa: 409.0

  carbon_cap:                 # total-carbon uptake cap, sum(nC * v_uptake) <= c_max
    # ADOPTED ON PARSA'S OWN EVIDENCE (P3 TASK 4), not on ours. His Gas Flux report sweeps
    # C_max = 60 / 100 / 120 / 180 and concludes, verbatim: "A tight cap gives respiratory gas
    # but a flat growth plateau; a loose cap gives a peaked TPC but fermentative gas.
    # C_max ~ 100-120 is the SWEET SPOT: peaked growth and respiration (RQ~1) around the
    # optimum." The same table calls the growth shape at C_max = 60 a "flat plateau".
    #   source: $PARSA_ROOT/outputs_reports/etcgem3_Gas Flux report_2.pdf, section 4
    #           ("Gas exchange and the total-carbon-cap sweep"), its C_max table and Figure 3.
    # 120 rather than 100 within his range, for one measured reason: at C_max = 100 acetate
    # overflow is ZERO on NLDM (reports/P2_settle/task3_cmax_table.csv), and a cap that
    # suppresses overflow defeats the configuration it is there to support. At 120 overflow is
    # non-zero on both media (glucose 23.5, NLDM 3.9 mmol gDW^-1 h^-1).
    # C_max = 60 is kept as a labelled sensitivity, configs/experiments/gasflux_configB_cmax60
    # -- it is what his Figure B2 used, and it sits PAST the T_opt transition (T_opt is flat
    # from uncapped to ~150 and falls 39.0 -> 32.5 C on NLDM between 80 and 60).
    c_max: 120.0
    # SCOPE OF THE 120 ABOVE (added 2026-09-09, P5): it is a GLUCOSE-MINIMAL / NLDM value. His
    # sweep and the P2/P3 sensitivity behind it were computed on those two media only. P4
    # applied it to LB as well and every LB growth R2 collapsed (0.83-0.90 -> 0.16-0.20)
    # while NLDM was unchanged to better -- an over-application, ours not his. On LB the
    # measured peak is 2.94 h^-1 and a 120 mmol C cap holds r_max at 1.1-1.8 whatever the
    # parameters, so the cap binds where on NLDM it does not.
    by_medium:                # per-medium caps, consumed by the fit runners
      # (reports/P4_refit/fits.py-style c_max= arguments, P6), NOT by config.apply_gasflux,
      # which reads the scalar c_max above; so no committed gasflux_* output changes.
      LB: 450.0
      # PROVENANCE (reports/P5_lb_cmax/, 2026-09-09): 450 is Parsa's own nominal cap for
      # configurations E and F on LB (CAP_NOM_E in his calibration_configD_full.py); his
      # fitted LB caps were 256.7 (D, on a nominal of 230), 459.3 (E) and 509.9 (F), all
      # within 13 % of their nominal. Evidence, deterministic (no sampler): at fixed
      # parameters the cap alone moves LB growth R2 from 0.64 / 0.05 / -0.10 (D / E / F at
      # 120) to 0.90 / 0.83 / 0.88 at each fit's own cap; re-optimised at 450, D / E / F give
      # growth R2 0.90 / 0.83-0.89 / 0.90 with respiration R2 0.78 / 0.86 / 0.85, the best
      # log-posterior of the caps tried for every configuration. 257 (D's own value) is
      # enough for D (0.89 / 0.83) but leaves E at 0.77 and F's respiration at 0.63.
      # Above 450 nothing has been tested (r_max 2.4-2.7 against the measured 2.94), and no
      # LB sensitivity to an unbounded cap has been run by anyone: that is the trigger to
      # revisit. None of these R2 is a converged posterior (docs/OPEN_ITEMS.md 1.12).

  overflow_line:              # Basan et al. 2015, Nature 528:99 (doi:10.1038/nature15765),
    exchange_rxn: EX_ac_e     # Fig. 1: threshold lambda_ac ~ 0.76 /h (stated) and a red-line
    slope: 21.0               # slope ~9.5 mM A600^-1 h^-1 per h^-1, which converts to
    threshold: 0.76           # ~21 mmol gDW^-1 h^-1 at 0.45 gDW L^-1 OD^-1.

  etc_table: etc/complexes.csv   # default ETC-complex table (see the file header)
  membrane:                      # inner-membrane area available per gDW (Szenk 2017 S1A)
    sv_um2_per_fL: 4.5           # surface-to-volume ratio
    dcw_pg_per_fL: 0.3325        # dry-cell density  -> A_mem ~ 1.35e19 nm^2/gDW
