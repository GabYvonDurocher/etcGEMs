# Strain: Methanococcus maripaludis (hydrogenotrophic methanogen). ORGANISM ONLY.
#
# Foundation phase (M1): this strain carries the base genome-scale model iMR539
# (Richards et al. 2016, BioModels BIOMD0000001099) solved by PLAIN FBA. The
# enzyme-constrained (ecModel) layer, the thermal layer and calibration are added in
# phases M2+; the provider `type` below will switch from `fba` (a placeholder for
# now — M1 loads the model directly with cobra) to an enzyme-constrained provider
# (sMOMENT-style, reusing src/etcgem/enzyme_cost, or GECKO) once the ecModel is built.
#
# Organism: Methanococcus maripaludis S2. Hydrogenotrophic: CO2 + 4 H2 -> CH4 + 2 H2O
# via the Wolfe cycle, terminating in methyl-coenzyme-M reductase (Mcr). Mesophile,
# growth optimum ~38 C (range ~18-47 C; Jones, Paynter & Gupta 1983). Slow-growing
# (mu_max ~0.18-0.23 /h, ~10x slower than E. coli) with unusual energetics: no
# cytochrome electron transport chain; energy conserved by a single membrane step
# (Mtr, Na+ translocation) driving an A1A0 ATP synthase, with Hdr electron
# bifurcation setting electron flow. See docs/METHANOGEN_ETCGEM_PLAN.md.

organism:
  name: Methanococcus maripaludis S2
  metabolism: hydrogenotrophic methanogen (CO2 + H2 -> CH4, Wolfe cycle)
  Topt_C: 38                  # growth optimum (Jones 1983)
  Trange_C: [18, 47]

provider:
  # M2: sMOMENT total-protein pool on the curated GEM (temperature-INDEPENDENT base
  # ecModel; M3 adds kcat(T)/unfolding). Cost per reaction i = MW_i/kcat_i, from a
  # shared proteome pool (src/etcgem/enzyme_cost). See outputs/M2_ecmodel.md.
  type: smoment_gem
  model_file: iMR539_curated.xml   # M1b carbon-honest autotroph (original iMR539.xml kept alongside)
  biomass_rxn: biomass0
  kcat_csv: dltkcat/kcat_table.csv  # measured core (Milton 2018 + biochem) + DLTKcat prior + fallback
  # M1b curation (see outputs/M1b_curation.md): archaellin removed from biomass (resolves
  # Membrane_lipid/NAC/Flagellin), tRNA(SeCys) recycling restored, organic-C leaks closed,
  # CH4 unpinned. Grows autotrophically on H2/CO2 with 99.98% of biomass carbon from CO2.
  # EMERGENT grounded pool budget = P_total x sigma x f_metab (independent data, NOT tuned
  # to mu_max; M4 calibrates magnitude). Reference kcats at T0 = 37 C.
  p_total: 0.5                # total protein per gDW (g/gDW; ~50% of dry mass, literature)
  sigma: 0.45                 # average in-vivo enzyme saturation (Davidi 2016 / Heckmann 2020)
  f_metab: 0.5                # modelled-metabolic-enzyme mass fraction (grounded; see M2 note)
  default_kcat: 25.0          # fallback if a CSV kcat is missing/non-positive
  close_free_sinks: null      # M2 PART D audit: no free ferredoxin/electron shortcut found
  relax_pinned:               # M2 PART D: release iMR539's hard-pinned uncosted ATP drain
    - rxn00062_LSQBKT_c0_RSQBKT_   # "protein-secreting ATPase" fixed 5.12 mmol/gDW/h -> becomes NGAM(T)
  # --- M3 thermal envelope (temperature-DEPENDENT; two-state unfolding) ---
  thermal_model: unfolding    # kcat(T) MMRT (Eyring) x native fraction f_N(T); falling limb set by Tm
  enzyme_params: thermal/enzyme_thermal_params.csv  # per-rxn Topt (mesophile prior)/Tm/Length/dCpt
  enzyme_params_key: rxn_id
  dcp_prior_kJ: -4.0          # literature MMRT dCp prior (Hobbs 2013); Ea EMERGES, not fitted
  ngam_temperature: true      # temperature-dependent maintenance NGAM(T)
  ngam_reaction: rxn00062_LSQBKT_c0_RSQBKT_   # the deferred ATP drain, now driven by NGAM(T)
  ngam_base_scale: 1.3021     # anchors NGAM(37C) = 7.836 mmol ATP/gDW/h (Goyal 2015 measured)

T0_C: 37                      # methanogen reference temperature (Jones 1983 optimum ~38 C)

temperature_grid:
  start_C: 5
  stop_C: 55
  n: 51

# --- M6 proteome-sector / allocation layer (the METHANOGEN'S OWN strategy) ---
# Grounded in Muller et al. 2021 (PNAS 118:e2025854118): M. maripaludis keeps a CONSTANT
# ribosomal proteome fraction and INVARIANT catabolic/anabolic allocation across growth
# rate (0.09 -> 0.002 /h), maintaining maximum methanogenesis capacity even at slow growth
# -- the opposite of the E. coli/yeast growth law where the ribosome fraction rises with mu.
# So the growth-law COUPLING SLOPE is ~0 (flat), NOT the bacterial Scott ~0.30. This makes
# the allocation buffer small BY THE ORGANISM'S OWN PHYSIOLOGY, grounding the M5 asymmetry.
proteome_sectors:
  enabled: true
  P_total: null              # back out from the M4 metabolic-pool budget / f_metab (keeps nominal growth)
  f_metab: 0.55              # methanogenesis-heavy metabolic sector (Mcr ~10% of protein; Xia/Muller)
  f_maint: 0.30              # maintenance/housekeeping (S-layer, chaperonin Hsp60) -> f_bio = 0.15
  sigma_nom: 0.45
  atpm_reaction: rxn00062_LSQBKT_c0_RSQBKT_
  biosynthesis_growth_law: true
  growth_law_slope: 0.0      # Muller 2021: CONSTANT ribosome fraction -> flat coupling (vs E. coli 0.30)
  growth_law_f_bio0: 0.15    # constant ribosome/biosynthesis fraction (= f_bio_nom; no mu-scaling)
  nominal_kcat_scale: 7.223  # M4 calibrated magnitude (the a-priori kcat_scale=1 is maintenance-crushed
                             # to mu~0, so the sector-build mu>0 check runs at the operating point)
  # Fixed biosynthesis/ribosome cap at the organism mu_max: a CONSTANT ribosome fraction (Muller
  # 2021) sets the translation cap at the physiological ceiling (M. maripaludis mu_max ~0.23/h),
  # ABOVE the TPC peak, so the ribosome cap does not clip the curve -- the metabolic pool binds
  # across the TPC and the allocation buffer is ~0 (the M5 asymmetry, grounded, not forced).
  # translation_coeff = f_bio * P_total / mu_max = 0.15 * 0.2045 / 0.23.
  translation_coeff: 0.133

# Defined H2/CO2 minimal medium (availability, not pinned uptake): the exchanges
# opened in M1 (resolved by ID at run time; see media/H2CO2_medium note).
medium:
  name: H2CO2_defined
  electron_donor: H2 (cpd11640)
  carbon_source: CO2 (cpd00011)
  nitrogen: ammonia (cpd00013)
  products: CH4 (cpd01024)
