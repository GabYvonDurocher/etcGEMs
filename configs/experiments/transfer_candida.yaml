# transfer_candida.yaml -- K1's gate experiment.
#
# Fit the three shared global parameters of the phenomenological thermal form on
# C. auris's measured growth curve ALONE, freeze them, and predict the other three
# species. Every between-species difference the model then makes comes only from the
# per-enzyme, sequence-predicted Topt and Tm in each strain's
# thermal/enzyme_thermal_params.csv.
#
# EVERY value below is the standalone Candida etcGEM's value
# (Candidas repository, gem/18_build_etcgem_tpc.py, commit f123bc7). This experiment
# exists so that the core reproduces that implementation's locked numbers; it decides
# nothing scientific. See reports/candida_thermal_limit/K1_port_verification.md.
#
# K2 PART A. This file is unchanged, but what it now runs is the BASELINE-CORRECTED
# configuration, because the strain default changed under it: maintenance is now an
# obligate, irreversible drain in every Candida strain (see any strain.yaml,
# provider.pin_at_ub). Under that correction this run reproduces
# gem/19_etcgem_counterfactual.py's recorded baseline exactly -- 19 applies the same
# correction. The UNCORRECTED run, which is what gem/18_build_etcgem_tpc.py did and what
# K1's locked mu table is compared against, is now
# configs/experiments/transfer_candida_unpinned.yaml.
#
# This is rung B0 of the K2 ladder: the standalone's thermal form, the core's own
# machinery still off, maintenance corrected.

kind: transfer

calibrate_on: cauris_iRV973
predict:
  - chaemulonii_draft
  - cduobushaemulonii_draft
  - cparapsilosis_iDC1003

# what is fitted on calibrate_on and then FROZEN across every strain
globals: [pheno_sigma, pheno_w, pool_budget]

# the calibration target: the strain's thermal/measured_tpc.csv (dead wells counted as
# zeros; built by the Candidas pipeline's 17_build_measured_tpc.py, copied not recomputed)
objective: measured_tpc

# One profile scale factor maps the model's peak onto the measured peak of the
# CALIBRATION strain, recomputed inside every objective evaluation and then frozen and
# applied to all four. The standalone's SCALE; not a fourth fitted dimension.
growth_scale: peak_match

optimizer:
  method: nelder-mead
  multistart: 4                # N = 4, the standalone's four simplex origins, in order
  starts:                      # [pheno_sigma, pheno_w, pool_budget]
    - [8,  3, 0.20]
    - [12, 5, 0.25]
    - [6,  2, 0.15]
    - [15, 8, 0.30]
  options:                     # scipy Nelder-Mead settings, as the standalone sets them
    maxiter: 120
    xatol: 0.3
    fatol: 1.0e-4
  penalty: 1000.0              # flat loss returned for a point outside the bounds below

# The standalone's guard: a strictly-greater-than constraint on each global, enforced by
# returning `penalty` rather than by a bounded optimiser.
lower_bounds:
  pheno_sigma: 1.0
  pheno_w: 0.3
  pool_budget: 0.02

# The thermal limit reported per strain: the highest temperature at which the scaled
# prediction still reaches the detection floor. Bisection bracket and tolerance as in the
# standalone's 22_thermal_sensitivity.py.
detection_floor_h: 0.05
thermal_limit:
  lo_C: 20.0
  hi_C: 90.0
  tol_C: 0.02

# --- K2 additions: diagnostics computed on every rung of the ladder ---
# Descriptors on a WIDE grid. The strain grid stops at 44 C, the top of the assay range and
# far below any model CTmax, so Topt/rmax/CTmax read off it would be truncated.
descriptor_grid:
  start_C: 15
  stop_C: 75
  n: 121                      # 0.5 C steps
crit_frac: 0.05               # CTmax = the crossing at 5% of rmax, the project convention

# The Figure-4 counterfactual, asked of each PREDICTED strain with the frozen globals:
# how far must this strain's enzymes move, uniformly, before the model puts it below
# detection at 40 C -- and does it still grow at the permissive temperature afterwards?
# Definitions are gem/19_etcgem_counterfactual.py's.
counterfactual:
  params: [dTm, dTopt]
  fail_T_C: 40.0
  permissive_T_C: 34.0
  threshold_h: 0.05
  permissive_frac: 0.7
  lo: -35.0
  tol: 0.1

# LEGACY FIDELITY (N2 TASK 2) -- see the comment on rescale_pool_row below.
provider:
  # LEGACY FIDELITY (N2 TASK 2): pool-row rescaling OFF. Everywhere else the default is
  # ON since N2, because the rescaled LP is mathematically identical and better conditioned
  # and Gurobi, GLPK and GLPK's exact rational solver then all agree. This run's job is to
  # reproduce the standalone EXACTLY, INCLUDING the ~0.4% error the standalone's own solver
  # made at the cold end of the two draft models, which a better-conditioned LP does not
  # reproduce. Fidelity to the original implementation and numerical correctness are now
  # different configurations; see reports/candida_thermal_limit/CONFIGURATIONS.md
  rescale_pool_row: false
