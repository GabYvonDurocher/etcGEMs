# CONFIGURATION A -- MMRT-costed transport.
#
# Give the uncosted inner-membrane carriers the same MMRT/unfolding envelope every metabolic
# enzyme has, so substrate uptake acquires a temperature-dependent ceiling and the O2 flux
# becomes determinate. No carbon cap.
#
# Parsa's finding, which this configuration exists to reproduce rather than to endorse: at the
# carrier turnover his figures used the transporter is too cheap to throttle carbon, the TCA
# cycle stays off and the cell ferments (RQ ~ 0), so no respiratory gas-flux result is
# obtainable. He did not carry this route into the later configurations.
kind: gasflux
proteome_sectors: {enabled: true, biosynthesis_growth_law: true}
allocation_from_data: null
gasflux:
  enabled: true
  perturbation_from: calibration_vanderlinden
  media: [glucose_minimal, NLDM, NLDM_blanket, LB, BHI]
                       # NLDM_blanket is the legacy medium Parsa's committed CSVs used;
                       # it is here so reports/P1_parsa_port/gate.py can compare against
                       # them exactly. NLDM (recipe ceilings) is the model to quote.
  temperatures: {start_C: 5, stop_C: 50, n: 91}
  metabolites: [o2, co2, glc__D, pyr, lac__D, ac]
  transport_costs:
    enabled: true        # carrier kcat / MW / length come from the strain's gas_exchange.yaml.
                         # The 30-vs-300 s^-1 disagreement in Parsa's sources was settled by
                         # experiment in P2 TASK 1 (300 reproduces his figure, 30 does not), so
                         # the strain now carries 300 and this overlay no longer overrides it.
