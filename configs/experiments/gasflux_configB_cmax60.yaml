# CONFIGURATION B at C_max = 60 -- SENSITIVITY ONLY; the baseline is
# gasflux_configB.yaml at the adopted C_max = 120. See P3 TASK 4.
#
# One shared cap on total carbon uptake, sum(nC * v_uptake) <= c_max. The cap abolishes
# overflow, so the TCA cycle carries flux and O2/CO2 become respiratory (RQ -> 1); it also
# gives a dilute defined medium a finite carbon budget. c_max is a boundary condition to be
# swept, not a fitted quantity.
#
# The four uncosted O2 sinks are closed by the PROVIDER (configs/defaults.yaml
# close_free_o2_sinks, commit 8085036, from Parsa's own audit) rather than by this layer.
kind: gasflux
proteome_sectors: {enabled: true, biosynthesis_growth_law: true}
allocation_from_data: null
gasflux:
  enabled: true
  perturbation_from: calibration_vanderlinden
  media: [glucose_minimal, NLDM, NLDM_blanket, LB, BHI]
                       # NLDM_blanket is the legacy medium Parsa's committed CSVs used;
                       # it is here so reports/P1_parsa_port/gate.py can compare against
                       # them exactly. NLDM (recipe ceilings) is the model to quote.
  temperatures: {start_C: 5, stop_C: 50, n: 91}
  metabolites: [o2, co2, glc__D, pyr, lac__D, ac]
  total_carbon_cap:
    enabled: true
    c_max: 60.0          # SENSITIVITY, not the baseline. This is the value Parsa's Figure B2
                         # used. His own sweep calls the growth shape here a "flat plateau" and
                         # recommends 100-120; at 60 acetate overflow is zero on both media,
                         # and 60 sits past the T_opt transition (39.0 -> 32.5 C on NLDM
                         # between c_max 80 and 60). Kept so his figure stays reproducible.
